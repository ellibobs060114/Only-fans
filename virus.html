<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL SYSTEM WARNING</title>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .warning-box {
            border: 4px solid #ff0000;
            padding: 40px;
            background-color: #110000;
            box-shadow: 0 0 20px #ff0000;
            animation: blink 1s infinite alternate;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        #countdown {
            font-size: 6rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ff0000;
        }
        @keyframes blink {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            100% { border-color: #550000; box-shadow: 0 0 5px #550000; }
        }
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #ff0000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 10px #ff0000;
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- Browser policies require user interaction (like a click) before playing loud audio -->
    <div id="start-screen">
        <button onclick="startPrank()">RUN SYSTEM UPDATE</button>
    </div>

    <div class="warning-box" id="prank-box" style="display: none;">
        <h1>INSTALLING MALWARE IN</h1>
        <div id="countdown">3</div>
    </div>

    <script>
        // Synthesises a loud, repeating police/siren sound using the Web Audio API
        function playSiren() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            setInterval(() => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                // Alternates frequencies rapidly to create a piercing siren wail
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.25);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // Volume control
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }, 500);
        }

        function startPrank() {
            // Hide the button, show the prank screen
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('prank-box').style.display = 'block';
            
            // Fire up the siren audio immediately
            playSiren();

            // 3-second countdown loop
            let timeLeft = 3;
            const countdownDisplay = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownDisplay.textContent = timeLeft;
                } else {
                    clearInterval(timer);
                    countdownDisplay.textContent = "DONE";
                    document.querySelector('h1').textContent = "MALWARE SUCCESSFULLY INSTALLED";
                }
            }, 1000);
        }
    </script>
</body>
</html>
